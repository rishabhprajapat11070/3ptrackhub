
name: Deploy TrackHub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-django-project/frontend/react-django-project/frontend/package-lock.json

      - name: Install dependencies
        working-directory: react-django-project/frontend/react-django-project/frontend
        run: npm ci

      - name: Build
        working-directory: react-django-project/frontend/react-django-project/frontend
        run: npm run build

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: react-django-project/frontend/react-django-project/frontend/dist

      - name: Deploy
        uses: actions/deploy-pages@v4
